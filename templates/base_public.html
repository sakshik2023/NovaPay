{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NovaPay — Payments, simplified{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="public">
  <nav class="pub-nav">
    <a class="brand" href="/" style="padding:0"><span class="logo"></span> NovaPay</a>
    <div class="links">
      <a href="/docs/">API docs</a>
      <a href="/demo-store/">Demo store</a>
      {% if user.is_authenticated %}<a class="btn" href="/dashboard/">Dashboard →</a>
      {% else %}<a href="/login/">Log in</a><a class="btn" href="/register/">Get started</a>{% endif %}
    </div>
  </nav>
  {% if messages %}<div class="msgs">{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
